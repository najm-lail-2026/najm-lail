
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    .cats {

      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 10px;
      display: block;
    }

    .cat div {
      padding: 12px 0;
      font-size: 20px;
    }

    .note {

    }
  </style>
</head>
<body>

  <div style="font-size:36px">☾ ✦</div>

    ❤️ رسالة من ليل ونجم 🐾

  <div class="cats">

</html>
